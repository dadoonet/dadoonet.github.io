baseURL = 'https://david.pilato.fr'
title = 'David Pilato'

locale = 'en-us'
defaultContentLanguage = "en"

enableRobotsTXT = true

[page]
  nextPrevInSectionSortOrder = "asc"

[module]
  [[module.imports]]
    path = "github.com/dadoonet/hugo-theme-devrel"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  # Reuse Pagefind index during local `hugo server`
  [[module.mounts]]
    source = "public/pagefind"
    target = "static/pagefind"
    disableWatch = true

[taxonomies]
category = "categories"
tag = "tags"
series = "series"
city = "cities"
language = "languages"

[params]
lightTheme = "emerald"
darkTheme = "forest"

images = ["me/background.jpg"]

author = "David Pilato"
description = "Developer | Evangelist"
avatar = "/about/david_pilato.avif"
headerTitle = "David Pilato"
motto = "Developer | Evangelist"

rss = true

utterancesRepo = "dadoonet/dadoonet.github.io"

email = "david+blog@pilato.fr"

siteStartYear = 2010

favicon = "favicon.ico"

stickyNav = true
reorderNavItems = ["search", "posts", "talks", "about_me"]
# "series" joins the overflow menu when at least one post sets series:
collapseNavItems = ["categories", "tags", "series", "rss"]
noDefaultSummaryCover = true
showTableOfContents = true
showSummaryCoverInPost = true
imageZoomableInPost = true
showPrevNextPost = true

[params.navItems]
talks = { href = "/talks", icon = "mic", title = "Talks" }
about_me = { href = "/about", icon = "body", title = "About me" }

[params.icons]
online = "🌎"

[params.talks]
pdf_base_url = "https://storage.googleapis.com/dadoonet-talks/slides/"

[params.search]
enabled = true

[params.advanced]
customCSS = ["css/custom.css"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
