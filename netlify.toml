# PR deploy previews only. Production stays on GitHub Pages (david.pilato.fr).
# Keep HUGO_VERSION in sync with .github/workflows/gh-pages.yml.
#
# Previews keep --buildFuture so scheduled posts (and talk pages whose
# Hugo date is still in the future) can be reviewed before they go live.
# GitHub Pages omits that flag: theme v0.3.0 announces upcoming talks via
# conference.date without publishing future-dated posts.

[build]
  command = "npm ci && hugo --gc --minify --buildFuture --baseURL \"${DEPLOY_PRIME_URL%/}/\" && npx pagefind --site public"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.165.0"
  HUGO_ENVIRONMENT = "production"
  HUGO_ENV = "production"
  NODE_VERSION = "22"
  GO_VERSION = "1.22.2"

# Skip production and branch deploys; only pull-request previews are built.
[context.production]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
