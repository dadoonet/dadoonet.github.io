# PR deploy previews only. Production stays on GitHub Pages (david.pilato.fr).
# Keep HUGO_VERSION in sync with .github/workflows/gh-pages.yml.
#
# Previews keep --buildFuture so scheduled posts can be reviewed before
# they go live. GitHub Pages omits that flag: Hugo leaves future-dated
# posts unpublished; upcoming talks use conference.date (theme ≥ v0.3.0).
# Theme v0.4.0 (when released) stops re-filtering those posts from
# archives, search, and RSS — bump go.mod then.

[build]
  command = "npm ci && hugo --gc --minify --buildFuture --baseURL \"${DEPLOY_PRIME_URL%/}/\" && npx pagefind --site public"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.165.0"
  HUGO_ENVIRONMENT = "production"
  HUGO_ENV = "production"
  NODE_VERSION = "22"
  GO_VERSION = "1.22.2"

# Skip production and branch deploys; only pull-request previews are built.
[context.production]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
